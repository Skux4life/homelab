apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft-stack
  namespace: minecraft
spec:
  interval: 10m
  chart:
    spec:
      chart: minecraft
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: minecraft-stack
        namespace: minecraft
      interval: 12h

  valuesFrom:
    - kind: Secret
      name: minecraft-values
      valuesKey: whitelist
      targetPath: minecraftServer.whitelist
    - kind: Secret
      name: minecraft-values
      valuesKey: ops
      targetPath: minecraftServer.ops

  values:
    replicaCount: 0
    minecraftServer:
      eula: "TRUE"
      type: "FORGE"
      version: "1.21.1"
      memory: 6G
      # serviceType: ClusterIP
      serviceType: NodePort
      nodePort: 30565
      gameMode: survival
      difficulty: peaceful

    persistence:
      dataDir:
        enabled: true
        storageClass: "local-path"
        accessMode: ReadWriteOnce
        size: 10Gi
